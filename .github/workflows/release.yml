name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Version Release
        id: version
        env:
          CURRENT_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          CURRENT_VERSION=$(git show "$CURRENT_SHA:package.json" | bun -e 'const input = await Bun.stdin.text(); console.log(JSON.parse(input).version)')
          PREVIOUS_VERSION=$(git show "$PREVIOUS_SHA:package.json" | bun -e 'const input = await Bun.stdin.text(); console.log(JSON.parse(input).version)')

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --title "v$VERSION" --notes "Release v$VERSION"

  build-assets:
    name: Build ${{ matrix.asset }}
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: tms-darwin
          - os: ubuntu-latest
            asset: tms-linux
          - os: windows-latest
            asset: tms-windows.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Binary
        shell: bash
        run: bun run scripts/build.ts --outfile "dist/${{ matrix.asset }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: dist/${{ matrix.asset }}
