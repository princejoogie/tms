name: Publish release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to, for example v0.3.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      - run: bun run package:smoke

      - name: Verify release tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${RELEASE_TAG}"

  standalone:
    needs: verify
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${RELEASE_TAG}"

      - run: bun run build:standalone -- ${{ matrix.target }}

      - name: Upload standalone release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "dist/release/tms-${{ matrix.target }}.tar.gz" "dist/release/tms-${{ matrix.target }}.tar.gz.sha256" --clobber

  update-homebrew:
    runs-on: ubuntu-latest
    needs: standalone
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download standalone checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/release
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "*.sha256" --dir dist/release

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          : "${GH_TOKEN:?Set HOMEBREW_TAP_TOKEN to a token with access to the Homebrew tap}"
          : "${HOMEBREW_TAP_REPOSITORY:?Set HOMEBREW_TAP_REPOSITORY, for example owner/homebrew-tap}"
          version="${RELEASE_TAG#v}"
          cat dist/release/*.sha256 > dist/release/checksums.txt
          checksum() {
            awk -v file="$1" '$2 == file { print $1 }' dist/release/checksums.txt
          }
          gh api --method POST "repos/${HOMEBREW_TAP_REPOSITORY}/dispatches" \
            -f event_type=tms-release \
            -f client_payload[tag]="${RELEASE_TAG}" \
            -f client_payload[version]="${version}" \
            -f client_payload[darwin_arm64_sha256]="$(checksum tms-darwin-arm64.tar.gz)" \
            -f client_payload[darwin_x64_sha256]="$(checksum tms-darwin-x64.tar.gz)" \
            -f client_payload[linux_arm64_sha256]="$(checksum tms-linux-arm64.tar.gz)" \
            -f client_payload[linux_x64_sha256]="$(checksum tms-linux-x64.tar.gz)"
